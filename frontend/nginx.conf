# Simple server configuration
server {
    # Listen on port 80, the standard HTTP port
    listen 80;
    server_name localhost;

    # The root directory where our static files are located
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is the key part for a Single Page Application (SPA).
    # It tells Nginx that if a requested file is not found on disk,
    # it should fall back to serving index.html. This allows
    # React Router to handle the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve caching for assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}